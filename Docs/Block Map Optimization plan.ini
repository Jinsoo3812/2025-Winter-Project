# 언리얼 엔진: 대규모 복셀 맵 최적화 및 GAS 연동 아키텍처 가이드

## 1. 개요 (Abstract)
100x100(1만 개) 이상의 블록을 개별 `AActor`로 관리하는 것은 엔진 오버헤드(가비지 컬렉션, 트랜스폼 갱신, 메모리)로 인해 심각한 성능 저하를 유발합니다.
이를 `Instanced Static Mesh (ISM)` 또는 `Hierarchical Instanced Static Mesh (HISM)`로 대체하면서도
기존의 **GAS 상호작용(파괴, 효과 적용)**과 **시각적 변화(머티리얼 교체)**, **절차적 생성**을 구현하는 아키텍처를 제안합니다.

---

## 2. 핵심 구조: Chunk 시스템 (The Chunk System)

맵 전체를 관리하는 대신, 맵을 일정 크기(예: 16x16 또는 32x32)의 **청크(Chunk)** 단위로 쪼개어 관리합니다.

### 2.1 액터(Actor) 계층 구조 변경
* **기존:** `World` -> `BlockActor` x 10,000
* **변경:** `World` -> `ChunkActor` (관리자) -> `HISM Component` (렌더링)

### 2.2 데이터와 렌더링의 분리
블록의 로직(데이터)과 시각적 표현(렌더링)을 철저히 분리해야 합니다.

* **논리 데이터 (Pure Data):**
    * `TArray<EBlockType>` 또는 1차원 배열을 사용하여 해당 청크 내의 블록 정보를 관리합니다.
    * `UObject`가 아닌 가벼운 `struct`나 `enum`으로 관리해야 멀티스레드 처리가 가능합니다.
* **시각적 표현 (Rendering):**
    * 블록 타입별로 별도의 HISM 컴포넌트를 가집니다.
    * 예: `HISM_Dirt`, `HISM_Stone`, `HISM_Ice`, `HISM_Fire`

---

## 3. GAS 상호작용 해결 방안 (Interaction with GAS)

블록이 Actor가 아니므로 `AbilitySystemComponent(ASC)`를 부착할 수 없습니다. 따라서 **가상 타겟팅(Virtual Targeting)**과 **프록시(Proxy) 패턴**을 사용합니다.

### 3.1 단일 타겟 처리 (LineTrace)
플레이어가 곡괭이로 블록을 때리는 경우입니다.

1.  **Hit 판정:** `LineTraceSingleByChannel` 수행.
2.  **인스턴스 식별:** `FHitResult.Item`은 맞은 인스턴스의 인덱스를 반환하고, `FHitResult.Component`는 맞은 HISM 컴포넌트를 반환합니다.
3.  **논리 변환:**
    * 맞은 컴포넌트가 `HISM_Stone`이고 인덱스가 `5`라면, 해당 청크의 데이터 배열에서 좌표를 역산합니다.
4.  **GAS 적용:**
    * 타겟(블록)에 ASC가 없으므로 `ApplyGameplayEffectToTarget`을 사용할 수 없습니다.
    * 대신, **"Gameplay Event"**를 활용합니다.
    * `SendGameplayEventToActor(Instigator, EventTag, Payload)`를 호출합니다.
    * `Payload`의 `TargetData`에 **블록의 위치(World Location)**와 **블록 타입 정보**를 실어 보냅니다.
    * GA(Gameplay Ability) 내부에서 이 Payload를 받아 "돌 깨짐" 로직(Data 수정 + 이펙트 재생)을 수행합니다.

### 3.2 범위 타겟 처리 (AoE, Overlap)
기존의 `SphereOverlapActors`는 ISM 개별 인스턴스를 감지하지 못합니다. 물리 엔진에 의존하는 대신 **수학적 계산(Grid Math)**을 사용해야 합니다.

1.  **중심점 및 반경 확인:** 스킬 시전 위치(Center)와 반경(Radius).
2.  **그리드 인덱스 추출:**
    * 물리 충돌 검사를 하지 **않습니다.**
    * `MinBound = Center - Radius`, `MaxBound = Center + Radius`를 계산합니다.
    * 해당 범위 안에 들어오는 **그리드(x, y, z) 인덱스**들을 반복문으로 계산합니다.
3.  **유효성 검사:** 계산된 인덱스가 실제 블록이 존재하는지(공기가 아닌지) 데이터 배열(`TArray`)을 통해 확인합니다.
4.  **로직 수행:** 유효한 블록들에 대해 로직을 수행합니다.

> **장점:** 물리 씬 쿼리(Physics Scene Query)보다 수학적 계산이 월등히 빠릅니다.

---

## 4. 시각적 효과 및 상태 변화 (Visuals & States)

### 4.1 머티리얼 변경 (예: 얼음 -> 불)
CPD(Custom Primitive Data)는 색상이나 단순 파라미터 변경에는 좋지만, 셰이더 로직이나 텍스처 자체가 완전히 바뀌는 경우에는 한계가 있습니다.

**해결책: 인스턴스 스와핑 (Instance Swapping)**
* `ChunkActor`는 가능한 모든 블록 타입에 대한 HISM 컴포넌트를 미리 가지고 있거나 필요시 생성합니다.
* **얼음 블록이 불 블록으로 변할 때:**
    1.  `HISM_Ice` 컴포넌트에서 해당 인스턴스를 제거(`RemoveInstance`).
    2.  `HISM_Fire` 컴포넌트의 동일한 월드 위치에 인스턴스를 추가(`AddInstance`).
    3.  내부 데이터(`TArray`)의 타입을 `Ice`에서 `Fire`로 변경.
* 이 과정은 매우 빠르게 처리되므로 프레임 드랍 없이 자연스럽게 보입니다.

### 4.2 장판 이펙트 (블록 위가 불타는 효과)
블록 자체를 바꾸는 것이 아니라, 블록 위에 상태 효과가 겹치는 경우입니다.

* **Niagara System 활용:**
    * 개별 액터를 스폰하지 마십시오.
    * 하나의 `NiagaraSystem` 관리자를 두고, 불타고 있는 모든 블록의 위치(Vector Array)를 나이아가라 파라미터로 넘겨주어 한 번에 렌더링합니다. (Niagara User Parameter Binding 활용).
* **데칼(Decal) 활용:**
    * 단순한 장판이라면 `DecalComponent`를 풀링(Pooling)하여 필요한 위치에 배치합니다.

### 4.3 복잡한 상호작용 (Destructible, 물리 시뮬레이션)
만약 특정 블록이 부서지면서 파편이 튀거나, 물리적으로 굴러가야 한다면 ISM으로는 불가능합니다.

**해결책: Actor Promotion (임시 액터 승격)**
1.  상호작용이 발생하는 순간, 해당 위치의 ISM 인스턴스를 **숨김 처리**하거나 제거합니다.
2.  그 위치에 `BP_DestructibleBlock` 같은 **진짜 Actor**를 스폰합니다.
3.  이 Actor는 GAS 상호작용, 물리 시뮬레이션을 수행합니다.
4.  상호작용이 끝나거나 파괴되면 Actor를 제거(Destroy)합니다.

---

## 5. 멀티스레드 및 절차적 생성 (Multithreading & PCG)

오픈월드처럼 맵이 계속 생성되어야 하므로, 게임 스레드(Game Thread)를 차단하지 않는 비동기 처리가 필수입니다.

### 5.1 아키텍처: 워커 스레드와 게임 스레드의 분리
언리얼의 `UObject` 시스템(Actor 생성, Component 수정 등)은 **메인 스레드(Game Thread)에서만** 접근 가능합니다. 따라서 철저히 **데이터 계산**과 **액터 반영**을 분리해야 합니다.

### 5.2 구현 단계
1.  **데이터 정의 (Thread-Safe):**
    * `FChunkData`라는 구조체를 정의합니다. (TArray<BlockType>, 위치 정보 등 포함). 언리얼 리플렉션이나 UObject 포인터를 포함하지 않도록 주의합니다.
2.  **비동기 작업 실행 (Worker Thread):**
    * `UE::Tasks::Launch` 또는 `FNonAbandonableTask`를 사용합니다.
    * 노이즈 알고리즘(Perlin Noise 등)을 수행하여 `FChunkData`를 채웁니다.
    * *주의:* 이 단계에서는 절대 액터를 스폰하거나 ISM을 건드리면 안 됩니다.
3.  **결과 통지 및 반영 (Game Thread):**
    * 계산이 완료되면 `AsyncTask(ENamedThreads::GameThread, [=](){ ... })`를 통해 메인 스레드로 데이터를 넘깁니다.
    * 메인 스레드는 `FChunkData`를 읽어서 `HISM->AddInstances()`를 수행합니다.

### 5.3 성능 팁
* **Time Slicing:** 한 프레임에 너무 많은 청크의 `AddInstance`를 수행하면 렉이 걸립니다. 큐(Queue)를 만들어 매 프레임 1~2개의 청크만 업데이트하도록 제한합니다.

---

## 6. 요약 및 적용 로드맵

1.  **구조 변경:** `TerrainBlock` 액터를 모두 제거하고, `ChunkManager` 액터와 `HISM Component` 구조로 변경하십시오.
2.  **데이터 분리:** 맵 데이터를 `AActor`가 아닌 순수 `struct/Array`로 관리하는 시스템을 구축하십시오.
3.  **멀티스레드 적용:** 맵 데이터 생성(수학 연산) 부분만 떼어내어 비동기 태스크로 만드십시오.
4.  **GAS 연동:** `LineTrace` 결과의 Item Index를 활용하고, 범위 공격은 그리드 좌표 계산으로 대체하십시오.
5.  **시각 효과:** 머티리얼 변경은 컴포넌트 간 이동(Swap)으로, 장판은 나이아가라 파티클로 처리하십시오.